name: Release

# Explicit release of a previously reviewed version/tag. Never bumps or pushes main.
# Configure npm's trusted publisher for rosariomoscato/droidsembly, release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. droidsembly-v0.4.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: droidsembly-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'rosariomoscato/droidsembly' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Match the Intel runner used by CI; macos-latest currently targets capacity-constrained ARM64.
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SWARM_HOME: ${{ github.workspace }}/.ci-swarm-home
      SWARM_PORT: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release identity and ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-metadata.mjs
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-package.mjs

  publish:
    needs: verify
    if: github.repository == 'rosariomoscato/droidsembly' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      SWARM_HOME: ${{ github.workspace }}/.ci-swarm-home
      SWARM_PORT: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set publication evidence directory
        shell: bash
        run: echo "RELEASE_EVIDENCE=$RUNNER_TEMP/droidsembly-release" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - id: release
        name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-metadata.mjs
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: artifact
        name: Pack exact artifact and snapshot unpublished identity and channels
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RELEASE_EVIDENCE"
          npm pack --ignore-scripts --json --pack-destination "$RELEASE_EVIDENCE" > "$RELEASE_EVIDENCE/pack.json"
          node scripts/verify-npm-publication.mjs capture
      - name: Smoke the exact artifact before publishing
        run: node scripts/smoke-package.mjs "${{ steps.artifact.outputs.tarball }}"
      - name: Publish public package with OIDC
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
        # Keep directory publication so npm records gitHead. The public bytes must
        # still match the exact pre-publish pack (verified below, fail closed).
        run: npm publish --ignore-scripts --access public --tag "$CHANNEL"
      - name: Confirm canonical public artifact and channels (read-only, bounded)
        run: node scripts/verify-npm-publication.mjs verify
      - name: Smoke the downloaded public artifact
        run: node scripts/smoke-package.mjs "$RELEASE_EVIDENCE/public.tgz"
      - name: Create fork release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          flags=()
          if [ "$CHANNEL" = next ]; then flags+=(--prerelease); fi
          previous=$(git describe --tags --abbrev=0 --match 'droidsembly-v*' HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" --generate-notes --notes-start-tag "$previous"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" --title "$TAG" --notes "First Droidsembly npm release. Based on CubeFarm by Leon van Zyl, MIT licensed. See the repository README for installation, provider costs and compatibility."
          fi
      - name: Preserve publication artifacts and availability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ inputs.tag }}
          path: ${{ env.RELEASE_EVIDENCE }}
          if-no-files-found: ignore
