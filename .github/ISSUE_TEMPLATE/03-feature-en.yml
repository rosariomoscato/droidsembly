name: Feature request (English)
description: Suggest an improvement to Droidsembly.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first; one proposal per issue. English and Italian are welcome.
        **Issues are public.** Use made-up examples; remove credentials, private project information and personal data from text and attachments. Use the contact form at https://droidsembly.com/en/ for sensitive details.
        Droidsembly remains free and MIT licensed; sponsorship is optional and unlocks no features. AI-provider costs are separate. A request is not a commitment to delivery.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to achieve, who is affected, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and a concrete example. Technical implementation is not required.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What do you do today? Are there simpler alternatives? Optional.
  - type: textarea
    id: context
    attributes:
      label: Affected workflows and compatibility
      description: Optional. Mention desktop/mobile, 3D/Pocket/PWA, English/Italian, accessibility, providers, data or launcher compatibility where relevant. Add redacted mockups with a text description if helpful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this request and its attachments and removed credentials, private project information and personal data.
          required: true
